<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atoms — Partenariat CPO</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Fragment+Mono&display=swap" rel="stylesheet">
<style>
/* VOICE: Atoms — sober, industrial, confident; a recommendation, not a report.
   IDEA: a site that behaves like a deck: one full screen per page, snapping, never between two.
   PICTURE: the Atoms bracket mark on the cover; the country × criteria matrix on L1.2.
   COLOUR and TYPE: black, cream #FFF7DD, bronze #C8AD86; Inter Tight for Switzer, Fragment Mono labels.
   LAYOUT: fixed rail of lots on the left with progress; snapping pages on the right. */
:root{color-scheme:dark;--bg:#000;--ink:rgba(255,247,221,.92);--ink2:rgba(255,247,221,.58);--line:rgba(255,255,255,.11);--card:#0b0b0a;--gold:#C8AD86;--cream:#FFF7DD}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.45 "Inter Tight",Inter,system-ui,sans-serif;letter-spacing:-.01em;overflow:hidden}
.app{display:grid;grid-template-columns:230px minmax(0,1fr);height:100dvh}
.mono{font-family:"Fragment Mono",monospace;font-size:12px;color:var(--ink2);letter-spacing:0}
/* rail */
.rail{border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.logo{font-weight:600;letter-spacing:.02em;color:var(--cream);font-size:17px}
.rail nav{display:grid;gap:2px}
.rl{display:block;border:0;background:none;text-align:left;font:inherit;font-size:14px;color:var(--ink2);padding:7px 8px;border-radius:3px;cursor:pointer;width:100%}
.rl:hover{color:var(--cream)}
.rl.on{color:var(--cream);background:rgba(200,173,134,.14)}
.rl b{font-family:"Fragment Mono",monospace;font-weight:400;color:var(--gold);font-size:12px;display:inline-block;width:30px}
.rl.sub{padding-left:38px;font-size:13px}
.dot{float:right;width:8px;height:8px;border-radius:50%;margin-top:6px;border:1px solid var(--ink2)}
.dot.done{background:var(--gold);border-color:var(--gold)}.dot.wip{background:linear-gradient(90deg,var(--gold) 50%,transparent 50%);border-color:var(--gold)}
.pbar{height:4px;background:rgba(255,255,255,.08);border-radius:2px}.pbar i{display:block;height:4px;background:var(--gold);border-radius:2px}
.rail .k{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2)}.rail .k span{display:flex;gap:5px;align-items:center}.rail .k .dot{float:none;margin:0}
/* pages */
.deck{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.pg{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;padding:clamp(20px,4vh,44px) clamp(20px,4vw,56px) clamp(44px,7vh,64px);overflow:hidden}
.ptop{display:flex;justify-content:space-between;align-items:center;gap:12px}
.lot{font-family:"Fragment Mono",monospace;font-size:12px;background:rgba(200,173,134,.18);color:var(--gold);padding:3px 8px;border-radius:3px}
.pfoot{position:absolute;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);bottom:clamp(14px,2.6vh,24px);display:flex;justify-content:space-between;font-family:"Fragment Mono",monospace;font-size:11px;color:var(--ink2)}
h1,h2{font-weight:400;color:var(--cream);text-wrap:balance;margin:0}
h2{font-size:clamp(22px,min(3.2vw,4.6vh),38px);line-height:1.1;margin:clamp(10px,2vh,22px) 0 clamp(8px,1.6vh,16px);max-width:none;width:100%;text-wrap:pretty}
.sub2{color:var(--ink2);max-width:80ch;margin:0 0 clamp(10px,2vh,20px);font-size:clamp(13px,1.8vh,16px)}
/* cover */
.cover{justify-content:center}
.cover h1{font-size:clamp(34px,min(5.4vw,8vh),66px);line-height:1.03;max-width:16ch;margin:16px 0}
.cover h1 em{font-style:normal;color:var(--gold)}
.cover p{color:var(--ink2);margin:0}
.mark{position:absolute;right:6vw;top:50%;transform:translateY(-50%);width:min(26vw,40vh)}
.toc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.toc button{text-align:left;border:1px solid var(--line);border-radius:4px;background:var(--card);padding:clamp(10px,2vh,18px);color:inherit;font:inherit;cursor:pointer}
.toc button:hover{border-color:var(--gold)}
.toc b{display:block;font-family:"Fragment Mono",monospace;font-weight:400;color:var(--gold);font-size:12px}
.toc span{display:block;color:var(--cream);font-size:clamp(15px,2.2vh,19px);margin-top:6px}
.toc em{display:block;font-style:normal;color:var(--ink2);font-size:13px;margin-top:4px}
/* criteria blocks */
.blocks{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;flex:1;min-height:0}
.blk{border:1px solid var(--line);border-radius:4px;background:var(--card);padding:clamp(12px,1.8vh,18px) clamp(12px,1.8vh,18px) clamp(18px,3vh,28px);display:flex;flex-direction:column;gap:clamp(6px,1.1vh,11px);overflow:auto}
.blk h3{margin:0;font-weight:500;color:var(--cream);font-size:clamp(16px,2.2vh,19px);display:flex;justify-content:space-between}
.blk h3 span{color:var(--gold)}
.cr{border-top:1px solid var(--line);padding-top:clamp(5px,1vh,10px)}
#l11 .blocks{grid-template-columns:minmax(0,40fr) minmax(0,32fr) minmax(0,28fr)}
.blocks .blk{scrollbar-width:none}.blocks .blk::-webkit-scrollbar{display:none}
#l11 .cr b{font-size:clamp(13px,1.75vh,15px)}#l11 .cr dl{font-size:clamp(11.5px,1.5vh,13.5px)}
.cr b{display:flex;justify-content:space-between;gap:8px;color:var(--cream);font-weight:500;font-size:clamp(14px,1.9vh,16px)}
.cr b span{color:var(--gold);white-space:nowrap}
.cr dl{margin:4px 0 0;display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:clamp(12px,1.6vh,14px)}
.cr dt{color:var(--ink2)}.cr dd{margin:0;color:var(--ink)}
.note{font-size:clamp(12px,1.6vh,14px);color:var(--ink2);margin-top:12px}
/* matrix */
.res{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;flex:1;min-height:0}
.mx{display:flex;flex-direction:column;min-height:0}
table{border-collapse:collapse;width:100%;font-size:clamp(12px,1.7vh,14px)}
th,td{border-bottom:1px solid var(--line);padding:clamp(4px,.9vh,8px) 6px;text-align:center;white-space:nowrap}
th{font-weight:500;color:var(--ink2);font-size:12px;vertical-align:bottom;white-space:normal;line-height:1.2}
th.l,td.l{text-align:left}
td.c{color:#000;font-weight:600;cursor:pointer;width:46px}
td.c:hover,td.c.sel{outline:2px solid var(--cream);outline-offset:-2px}
td.t{color:var(--cream);font-size:clamp(14px,2vh,17px)}
td.o{color:var(--ink2)}
tr.out td.l,tr.out td.t{color:var(--ink2)}
.det{margin-top:10px;border:1px solid var(--line);border-radius:4px;padding:10px 12px;font-size:clamp(12px,1.6vh,14px);color:var(--ink2);min-height:64px;background:var(--card)}
.det b{color:var(--cream);font-weight:500}.det a{color:var(--gold)}
.al h3{margin:0 0 8px;font-weight:500;color:var(--cream);font-size:clamp(15px,2vh,17px)}
.arow{display:grid;grid-template-columns:86px minmax(0,1fr) 26px;gap:10px;align-items:center;font-size:clamp(12px,1.7vh,14px);margin-bottom:clamp(5px,1vh,9px)}
.bar{display:flex;height:clamp(14px,2.4vh,22px);gap:2px}.bar i{display:block;height:100%}
.arow b{color:var(--cream);font-weight:500;text-align:right}
.y1{background:#C8AD86}.y2{background:#8f7a5a}.y3{background:#4d4334}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:6px 0 12px}.leg i{display:inline-block;width:9px;height:9px;margin-right:5px}
.rule{font-size:clamp(12px,1.6vh,13.5px);color:var(--ink2);border-top:1px solid var(--line);padding-top:10px}
.rule ol{margin:4px 0 0;padding-left:18px}.rule li{margin-bottom:3px}.rule b{color:var(--ink);font-weight:500}
.ph{flex:1;border:1px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
/* L2 */
.l2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;flex:1;min-height:0}
.mapw{display:flex;flex-direction:column;min-height:0}
.map{flex:1;min-height:0;display:flex}.map svg{width:100%;height:100%}
.mnote{margin:6px 0 0;font-size:11.5px;color:var(--ink2)}
.side{display:flex;flex-direction:column;gap:clamp(8px,1.4vh,12px);min-height:0;overflow:auto}
.stp h3{margin:0 0 6px;font-weight:500;color:var(--cream);font-size:clamp(15px,2vh,17px)}
.stp ol{margin:0;padding-left:18px;font-size:clamp(12px,1.6vh,14px);color:var(--ink2)}.stp li{margin-bottom:4px}.stp b{color:var(--ink);font-weight:500}
.zt td{white-space:normal;vertical-align:top;text-align:left;font-size:clamp(12px,1.6vh,13.5px)}.zt td:first-child{color:var(--cream);white-space:nowrap}
.zb{display:inline-flex;width:20px;height:20px;border-radius:50%;background:#E3C38F;color:#000;font-weight:600;font-size:12px;align-items:center;justify-content:center;margin-right:7px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:2px 9px;border-radius:999px;cursor:pointer;min-height:28px}
#l2 h2{font-size:clamp(20px,min(2.4vw,3.6vh),30px)}
.chip:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.chip[aria-pressed=false]{opacity:.38}
.chip i{display:inline-block;width:12px;height:12px;flex:none}
.map{position:relative}
.tip{position:absolute;left:0;top:0;pointer-events:none;background:#0b0b0a;border:1px solid rgba(200,173,134,.5);border-radius:4px;padding:6px 9px;font-size:13px;color:var(--ink2);max-width:270px;opacity:0;transition:opacity .12s;z-index:2}
.tip b{display:block;color:var(--cream);font-weight:500}
.map svg [data-tip]{cursor:pointer}
.l2ctl{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:4px;z-index:1}
.l2ctl button,.l2pre button{background:#0b0b0a;border:1px solid var(--line);color:var(--cream);font:inherit;cursor:pointer;border-radius:4px}
.l2ctl button{width:34px;height:34px;font-size:18px;line-height:1}
.l2pre{position:absolute;left:8px;bottom:8px;display:flex;gap:4px;flex-wrap:wrap;z-index:1}
.l2pre button{font-size:13px;padding:6px 10px;min-height:32px}
.l2ctl button:hover,.l2pre button:hover{border-color:var(--gold)}
.l2ctl button:focus-visible,.l2pre button:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.mdet{margin-top:8px;border:1px solid var(--line);border-radius:4px;padding:8px 11px;font-size:13px;color:var(--ink2);background:var(--card);min-height:58px}
.mdet b{color:var(--cream);font-weight:500}.mdet a{color:var(--gold)}
.map{overflow:hidden;border-radius:4px}
.map svg .st:hover circle:not([fill=transparent]),.map svg .st:hover rect{stroke:#FFF7DD;stroke-width:3}
.map svg .zn.hl rect{stroke:#E3C38F}
.map svg .zn path:first-child{transition:stroke-opacity .15s}.map svg .zn.hl path:first-child{stroke-opacity:.62}
.zt tr[data-z]{cursor:pointer}.zt tr.hl td{background:rgba(227,195,143,.12)}
/* L4 */
#l4 h2{font-size:clamp(20px,min(2.4vw,3.6vh),30px);margin-bottom:clamp(6px,1.2vh,12px)}
.l4{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:12px 22px;flex:1;min-height:0}
.l4L{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.4fr);gap:12px;min-height:0}
.pan{display:flex;flex-direction:column;min-height:0;border:1px solid var(--line);border-radius:4px;background:var(--card);overflow:hidden}
.pan .cap{font-family:"Fragment Mono",monospace;font-size:11px;color:var(--ink2);padding:6px 9px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pan .cap b{color:var(--gold);font-weight:400}
.pan .map{flex:1;min-height:0}
.pbody{flex:1;min-height:0;display:flex;position:relative}.pbody svg{width:100%;height:100%;display:block}
.l4R{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:auto;scrollbar-width:none}.l4R::-webkit-scrollbar{display:none}@media(max-height:780px){.l4B .bg{display:none}}
.vc{border:1px solid var(--line);border-radius:4px;background:var(--card);padding:clamp(6px,1vh,10px) 12px;font-size:clamp(11.5px,1.42vh,13px);line-height:1.38;color:var(--ink2);flex:1 1 auto}
.vc h3{margin:0 0 3px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:500;color:var(--cream);font-size:clamp(14px,1.9vh,16.5px)}
.vd{font-family:"Fragment Mono",monospace;font-size:11px;padding:1px 9px;border-radius:999px;color:#000;font-weight:600;white-space:nowrap}
.vd.g{background:#7CC58A}.vd.o{background:#E9A23B}
.vc ul{margin:0;padding-left:16px}.vc li{margin-bottom:1px}.vc b{color:var(--ink);font-weight:500}
.l4B{grid-column:1/-1;display:grid;grid-template-columns:1.5fr 1fr 1fr 1.1fr;gap:16px;border:1px solid rgba(200,173,134,.35);border-radius:4px;padding:clamp(8px,1.3vh,12px) 14px;font-size:clamp(11.5px,1.45vh,13px);color:var(--ink2)}
.l4B .h{display:block;color:var(--gold);font-weight:500;margin-bottom:2px}
.l4B .bg{display:block;color:var(--cream);font-size:clamp(15px,2.3vh,20px);line-height:1.15;margin-bottom:3px}
.l4B b{color:var(--ink);font-weight:500}
.l4b{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;flex:1;min-height:0}
.loc{flex:1;min-height:0;position:relative}.loc svg{width:100%;height:100%;display:block}
.pan .chips{padding:6px 8px;margin:0;border-bottom:1px solid var(--line)}
.pan .mdet{margin:0;border:0;border-top:1px solid var(--line);border-radius:0;min-height:0;font-size:12.5px;max-height:38%;overflow:auto}
.pan .tip{z-index:3}
.vsw{position:absolute;top:8px;right:8px;display:flex;z-index:2}.vsw button{font:inherit;font-size:12.5px;color:var(--ink2);background:rgba(11,11,10,.88);border:1px solid var(--line);padding:5px 10px;cursor:pointer}.vsw button:first-child{border-radius:4px 0 0 4px}.vsw button:last-child{border-radius:0 4px 4px 0;border-left:0}.vsw button[aria-pressed=true]{color:#000;background:var(--gold);border-color:var(--gold)}.vsw button:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.lst{border:1px solid rgba(200,173,134,.5);border-radius:4px;background:var(--card);padding:clamp(8px,1.3vh,12px) 12px;font-size:clamp(11.5px,1.5vh,13px);color:var(--ink2)}
.lst .lh{display:flex;justify-content:space-between;align-items:center;gap:8px}.lst .lh b{color:var(--cream);font-weight:500;font-size:clamp(14px,1.9vh,16.5px)}
.lst .lk{display:flex;gap:16px;margin:4px 0}.lst .bg{color:var(--cream);font-size:clamp(15px,2.2vh,19px);line-height:1.15}
.lst p{margin:2px 0 6px}.lnk{display:inline-block;color:#000;background:var(--gold);font-weight:600;padding:5px 12px;border-radius:4px;text-decoration:none;font-size:13px}
.lnk:hover{background:var(--cream)}.lnk:focus-visible{outline:2px solid var(--cream);outline-offset:2px}
.vc .bg{color:var(--gold);font-size:.95em;font-weight:500}
.l4R{gap:8px}.mth{border:1px solid var(--line);border-radius:4px;background:var(--card);padding:6px 11px;font-size:clamp(11.5px,1.45vh,13px);line-height:1.3;color:var(--ink2)}.mth h3{margin:0 0 4px;font-weight:500;color:var(--cream);font-size:clamp(13px,1.75vh,15px)}.mth ol{margin:0;padding-left:16px}.mth li{margin-bottom:2px}.mth b{color:var(--ink);font-weight:500}.mth .wh{color:var(--ink2);opacity:.9}.mth a.src{padding:0!important;margin:0!important;display:inline!important;background:none!important;border:0!important;min-height:0!important;color:var(--gold);text-decoration:underline;text-underline-offset:2px}.l4go{white-space:nowrap;flex-wrap:nowrap;overflow:hidden;display:flex;align-items:center;gap:10px;font-family:'Fragment Mono',monospace;font-size:11.5px;text-transform:uppercase;color:var(--gold);letter-spacing:.03em}.l4go:after{content:"";flex:1;height:1px;background:var(--line)}.l4go a.l4top{order:2;margin:0;text-transform:none;white-space:nowrap;flex:none;font-size:clamp(10.5px,1.2vw,12px)}.l4go span{white-space:nowrap;flex:none}.vc p{margin:0;font-size:.9em}.l4R .vc{padding:5px 11px}.l4R .vc h3{font-size:clamp(13px,1.7vh,15px);margin-bottom:1px}.vc em{color:var(--gold);font-style:normal}.vc h3 .n{display:inline-block;width:18px;height:18px;line-height:18px;text-align:center;border-radius:50%;background:var(--gold);color:#111;font-style:normal;font-size:11px;margin-right:7px;font-family:'Fragment Mono',monospace}.vc{flex:0 0 auto}.inset{top:8px!important;bottom:auto!important;pointer-events:none;width:164px!important;max-width:164px!important;aspect-ratio:auto!important;height:auto!important}.inset .map{aspect-ratio:1400/1180;flex:none!important}.inset .icap{white-space:nowrap;font-size:9.5px!important;padding:2px 5px!important}.mth,.mth li{text-align:left}#l4 h2{white-space:nowrap;font-size:clamp(16px,calc((100vw - 300px)/34),34px)}#l4 .pan .cap{white-space:nowrap;overflow:hidden;display:flex!important;flex-wrap:nowrap!important;gap:10px;justify-content:space-between}#l4 .pan .cap span,#l4 .pan .cap b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}#l4 .pan .chips{display:flex;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;gap:6px}#l4 .pan .chips .chip{flex:none;white-space:nowrap;padding-left:9px;padding-right:9px}.vc .kk{display:inline-block;font-family:'Fragment Mono',monospace;font-size:.82em;letter-spacing:.02em;text-transform:uppercase;color:var(--gold);min-width:5.6em;margin-right:6px}.vc a.lnk{padding:2px 8px;font-size:.92em;margin-left:4px}.l4R>a.l4top{align-self:flex-start;margin:0 0 2px;padding:5px 12px;border-radius:4px;color:#111;text-decoration:none;font-family:'Fragment Mono',monospace;font-size:12px;flex:none}
.l4L{display:flex!important;min-height:0}.l4L .pan{flex:1;position:relative}.pbody{position:relative}.inset{position:absolute;left:8px;bottom:8px;width:27%;max-width:200px;aspect-ratio:3/4;border:1px solid rgba(200,173,134,.55);border-radius:4px;background:#000;overflow:hidden;z-index:2;display:flex;flex-direction:column}.inset .icap{font-family:"Fragment Mono",monospace;font-size:10.5px;padding:3px 6px;color:var(--ink2);background:#0b0b0a}.inset .map{flex:1;min-height:0}.inset .l2ctl{display:none}.l4L .pan .mdet{position:absolute;left:8px;right:8px;bottom:8px;border:1px solid rgba(200,173,134,.5);border-radius:4px;background:rgba(11,11,10,.97);z-index:4;max-height:46%;overflow:auto}/* L3 */
.l3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;flex:1;min-height:0}
.q4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;flex:1;min-height:0}
.l3 .blk,.q4 .blk{overflow:auto}
.l3 ul,.q4 ul{margin:0;padding-left:16px;font-size:clamp(12px,1.6vh,14px);color:var(--ink2)}.l3 li,.q4 li{margin-bottom:4px}.l3 li b,.q4 li b{color:var(--ink);font-weight:500}
.l3 td{white-space:normal;text-align:left;vertical-align:top;font-size:clamp(12px,1.55vh,13.5px)}
.l3 td.n{text-align:right;color:var(--cream);white-space:nowrap}
.eq{border:1px solid rgba(200,173,134,.45);border-radius:4px;padding:8px 10px;font-size:clamp(12px,1.6vh,14px);color:var(--ink)}.eq b{color:var(--gold);font-weight:500}
.tg{font-family:"Fragment Mono",monospace;font-size:11px;padding:1px 6px;border-radius:3px;background:rgba(255,255,255,.1);color:var(--ink);white-space:nowrap}

const PREP3={id:"ann3",rail:"Prépa L3",lot:"A",html:`<div class="ptop"><span class="lot">Annexe · L3 Fiche de préparation à l'oral</span><span class="mono">Q&amp;R</span></div><h2>Préparation : risques, assiette et mécanisme de partage</h2><div class="l3"><div class="blk"><h3>Qui porte quel risque</h3><p class="note" style="margin:0">Principe : chaque risque va à la partie qui le contrôle.</p><table><tbody><tr><td><span class="tg">Atoms</span></td><td>Foncier, raccordement, construction, CAPEX</td></tr><tr><td><span class="tg">CPO</span></td><td>Exploitation, disponibilité, prix de vente, commercialisation auprès des flottes</td></tr><tr><td><span class="tg">Partagé</span></td><td>Adoption des camions électriques : personne ne la contrôle</td></tr></tbody></table><div class="eq">Volume = <b>camions électriques sur le corridor</b> (marché, partagé) × <b>part qui s'arrête chez nous</b> (captage, CPO)</div><ul><li>Marché lent : perte partagée par le partage de revenus.</li><li>CPO qui sous-performe : KPI, pénalités, puis résiliation.</li><li>Pour trancher : volumes comparés à un indice de marché (immatriculations, trafic PL électrique du corridor).</li><li>Sites validés conjointement, avec droit de veto du CPO : il ne peut pas invoquer l'emplacement ensuite.</li></ul></div><div class="blk"><h3>Assiette : le revenu net</h3><table><tbody><tr><td class="n">+</td><td>Recharge, y compris abonnements flottes imputés au site au kWh délivré</td></tr><tr><td class="n">−</td><td>Électricité, au prix de marché</td></tr><tr><td class="n">+</td><td>Services annexes (restauration, parking, réservation), nets de leurs coûts directs</td></tr><tr><td class="n">+</td><td>Certificats et crédits carbone</td></tr></tbody></table><div class="cr"><b>Clauses anti-fuite</b><ul style="margin-top:6px"><li><b>Électricité achetée via une filiale</b> : prix de transfert aux conditions de marché</li><li><b>Abonnements et prépaiements hors site</b> : revenu réputé = kWh délivrés × prix moyen réalisé</li><li><b>Remises aux partenaires</b> : droit d'audit, prix public comme référence</li><li><b>Volumes détournés vers ses propres hubs</b> : non-concurrence dans un rayon défini sur le corridor</li><li><b>Opacité</b> : livre ouvert, données de session en temps réel pour Atoms</li></ul></div></div><div class="blk"><h3>Mécanisme de partage</h3><table><thead><tr><th class="l">Revenu net / cas de base</th><th>Atoms</th><th>CPO</th></tr></thead><tbody><tr><td>Jusqu'à 150 %</td><td class="n">50 %</td><td class="n">50 %</td></tr><tr><td>150 à 200 %</td><td class="n">45 %</td><td class="n">55 %</td></tr><tr><td>200 à 250 %</td><td class="n">40 %</td><td class="n">60 %</td></tr><tr><td>Au-delà de 250 %</td><td class="n">35 %</td><td class="n">65 %</td></tr></tbody></table><ul><li><b>Plancher</b> : paiement annuel minimum calé sur le CAPEX et le service de la dette, pas sur le revenu potentiel. Atoms touche le plus élevé des deux : plancher ou sa part.</li><li><b>Montée en charge</b> : pas de plancher pendant 24 mois.</li><li><b>Contrepartie pour le CPO</b> : ses compléments au plancher lui sont remboursés sur le revenu au-dessus du cas de base.</li><li><b>Des paliers plutôt qu'un plafond</b> : Atoms finance tout le CAPEX et garde une part du potentiel ; le CPO reste incité à surperformer.</li></ul><p class="note" style="margin-top:0">Hypothèse à vérifier en L5 : avec 50 %, le CPO couvre ses OPEX (maintenance, logiciel, frais de paiement) et garde une marge.</p></div></div>`};
PG.push({id:"l3",rail:"Partenariat",lot:"L3",html:`<div class="ptop"><span class="lot">L3 · Structure du partenariat</span><span class="mono">Task 1</span></div><h2>Atoms porte l'actif, le CPO porte la performance : un partage hybride avec plancher et paliers</h2><div class="mir"><div class="hd a"><div>Atoms <span>apporte l'actif et protège son capital</span></div></div><div class="hd lb"></div><div class="hd"><div>CPO <span>exploite et est rémunéré à la performance</span></div></div><div class="a"><span>Foncier, raccordement, construction, CAPEX.</span><span>Perçoit les subventions, qui réduisent le CAPEX.</span></div><div class="lb">Responsabilités</div><div>Exploitation, maintenance, logiciel, relation client, prix, facturation.</div><div class="sh"><b>Revenu net partagé</b><span>Recharge (abonnements flottes imputés au site) + services annexes nets + certificats − électricité au prix de marché · livre ouvert, audit</span><span><span class="gd">Paliers autour d'un <button type="button" class="cb" data-pop="popcb" aria-controls="popcb">cas de base figé</button></span> : part Atoms / CPO selon le revenu net rapporté au cas de base</span><div class="tiers"><span><em>≤ 150 %</em>50 / 50</span><span><em>150–200 %</em>45 / 55</span><span><em>200–250 %</em>40 / 60</span><span><em>&gt; 250 %</em>35 / 65</span></div></div><div class="a"><span class="gd">Plancher couvrant la dette, après 24 mois</span><span>Rien pendant la montée en charge. Atoms touche le plus élevé du plancher ou de sa part ; ses fonds propres restent exposés au trafic.</span></div><div class="lb">Rémunération</div><div>Sa part du revenu net, qui augmente avec la performance. Elle couvre ses OPEX et sa marge.</div><div class="a">Réserve de renouvellement alimentée par le revenu net. Atoms remplace les bornes vers l'année 10, contre une prolongation de 5 ans (hyp.).</div><div class="lb">Engagements</div><div>Disponibilité ≥ 97–98 %, intervention en moins de 24–48 h, prix ≤ marché + 5 % (hyp.). Bonus ou malus sur sa part.</div><div class="a"><span class="gd">Actifs à Atoms et droit de reprise de l'exploitation</span><span>L'opérateur peut être remplacé rapidement. Résiliation pour sous-performance, garantie de la maison-mère.</span></div><div class="lb">Protections</div><div>Ses compléments au plancher lui sont remboursés au-dessus du cas de base. Exclusivité : chaque site lui est proposé en premier ; la réserve suit l'opérateur en place.</div></div><div class="band3"><b>Cadre et termes</b><span><span class="gd">Accord-cadre + annexe par site</span> : principes fixés une fois ; tout site conforme est exploité par le CPO</span><span>Durée 10–12 ans, renouvelable</span><span>Non-concurrence du CPO dans un rayon défini sur le corridor</span><span>Fin de contrat : actifs, données et contrats flottes à Atoms</span></div><p class="fn">Cliquer sur « cas de base figé » pour le détail du calcul. Parts illustratives, calibrées en L5 : TRI cible d'Atoms sur le CAPEX ; OPEX et marge du CPO.</p><div class="pop" id="popcb" role="dialog" aria-label="Cas de base" hidden><button type="button" class="x" aria-label="Fermer">×</button><h4>Le cas de base : comment il est calculé</h4><p style="margin:0">Le revenu net annuel attendu pour chaque site, dans le scénario central du business case validé en comité d'investissement.</p><div class="eqn">kWh vendus × (prix de vente − coût de l'électricité) + services annexes nets + certificats</div><ul><li><b>kWh vendus</b> : nombre de points × puissance × taux d'utilisation × heures dans l'année (hypothèses L0 et L5).</li><li><b>Prix et coût de l'électricité</b> : référence de marché (grille du partenaire, prix Eurostat).</li><li><b>Une courbe année par année</b>, pas un chiffre unique, pour intégrer la montée en charge de l'utilisation.</li><li><b>Figé</b> à la signature de l'annexe du site, <b>indexé</b> sur l'inflation.</li><li><b>Jamais révisé selon la performance réelle</b> : sinon le CPO aurait intérêt à sous-performer pour atteindre les paliers plus vite. Révision seulement en cas d'événement extérieur majeur (règlementation, puissance réduite par le gestionnaire de réseau).</li></ul></div>`});
PG.push({id:"l4",rail:"Site",lot:"L4",html:`<div class="ptop"><span class="lot">L4 · Choix du site · Zone 1 Atlantique France</span><span class="mono">Task 2</span></div><h2>Site exemple : 5 000 m² à Saint-André-de-Cubzac, à 2,1 km de l'A10</h2><div class="l4"><div class="l4L"><div class="pan"><div class="cap"><span>Carte · zoom, déplacement, mesure ↔</span><b><a href="https://www.openstreetmap.org/?mlat=44.9918&mlon=-0.4347#map=12/44.99/-0.43" target="_blank" rel="noopener" style="color:inherit">OpenStreetMap ↗</a> · positions approx.</b></div><div class="chips" id="l4chips"></div><div class="pbody"><div id="l4loc" class="loc"></div><div class="inset" id="l4ins"><div class="icap">Site en zone 1 (carte L2)</div><div class="map" id="l4insmap"></div></div><div class="mdet" id="l4det"></div></div></div></div><div class="l4R"><div class="mth"><h3>Méthode · 4 filtres pour passer d'une zone à un site</h3><ol>

<div class="vc"><h3><span><i class="n">1</i>Axe et sortie</span><span class="vd g">VERT</span></h3><p>À <b>2,1 km</b> de la sortie 40 de l'A10, 3,9 km de la 39a ; Bordeaux ≈ 26 km. Pas de borne PL repérée.</p></div>

<div class="vc"><h3><span><i class="n">3</i>Urbanisme</span><span class="vd o">ORANGE</span></h3><p><em>Hypothèse :</em> zone d'activités compatible, aucun point bloquant identifié (PLU et Géorisques à vérifier).</p></div>
<div class="vc"><h3><span><i class="n">4</i>Surface</span><span class="vd o">ORANGE</span></h3><p><b>5 000 m²</b> pour 550 000 € (<b>110 €/m²</b>) : suffisant pour 8 postes, mais sans réserve phase 2 et 2,4 × le prix visé.</p></div></div></div>`});
PG.push({id:"l5",rail:"Business case",lot:"L5",html:`<div class="ptop"><span class="lot">L5 · Business case indicatif · Saint-André-de-Cubzac</span><span class="mono">Task 2 · <button type="button" class="cb" data-pop="popl5" aria-controls="popl5">Méthode de calcul</button></span></div><h2 id="l5h"></h2><p class="sub2" id="l5sub" style="margin-bottom:8px"></p><div class="l5" id="l5root"></div><div class="pop" id="popl5" role="dialog" aria-label="Méthode de calcul" hidden><button type="button" class="x" aria-label="Fermer">×</button><h4>Comment le business case est calculé</h4><div class="eqn">Revenu net = bornes × recharges/jour × 365 × kWh × (prix de vente − coût de l'électricité)</div><ul><li><b>Partage (L3)</b> : Atoms perçoit 50 % du revenu net jusqu'à 150 % du cas de base, puis 45 %, 40 % et 35 % par tranches. Le cas de base est figé : c'est le scénario « Base », même si les curseurs bougent.</li><li><b>EBITDA d'Atoms</b> = sa part − taxe foncière − assurance (indexées).</li><li><b>Impôt</b> : IS 25 % sur EBITDA − amortissement (linéaire 15 ans, terrain exclu), avec report des déficits.</li><li><b>Renouvellement</b> des bornes en année 10, amorti sur 10 ans (L3).</li><li><b>TRI</b> : flux an 0 = − CAPEX ; flux an 1 à 20 = EBITDA − impôt − renouvellement ; 100 % fonds propres ; aucune valeur résiduelle.</li><li><b>Non modélisé</b> : plancher de paiement de L3 (utile surtout dans le scénario dégradé), phasage de la montée en charge sur 24 mois.</li></ul></div>`});

 document.querySelectorAll('.zt tr[data-z]').forEach(r=>{r.addEventListener('mouseenter',()=>hl(r.dataset.z));r.addEventListener('mouseleave',()=>hl(null));r.addEventListener('click',()=>hl(r.dataset.z));});
 document.querySelectorAll('#chips .chip').forEach(b=>b.addEventListener('click',()=>{const on=b.getAttribute('aria-pressed')!=='true';b.setAttribute('aria-pressed',on);const k=b.dataset.ly;svg.querySelectorAll('.ly-'+k+(k==='zones'?',.zl':'')).forEach(g=>g.style.display=on?'':'none');}));};

const det=document.getElementById('det');
const show=td=>{document.querySelectorAll('td.c.sel').forEach(x=>x.classList.remove('sel'));td.classList.add('sel');const p=P[+td.dataset.p],j=+td.dataset.j,c=CR[j],s=p.s[j];
 det.innerHTML=`<b>${p.c} · ${c.n} : ${s}/5</b><br>Donnée : ${p.v[j]}<br>Barème : ${s} = ${c.bar[5-s]}${p.src[j].length?` · Source ${p.src[j].map(n=>{const u=SRC[n-1].split('|');return `<a href="${u[1]}">[${n}] ${u[0]}</a>`}).join(', ')}`:' · Hypothèse, pas de source'}`;};

const g6off=()=>{const tip=document.getElementById('g6tip');if(tip)tip.hidden=true;document.querySelectorAll('[data-g6].sel').forEach(x=>x.classList.remove('sel'));};
const g6=el=>{const i=el.dataset.g6,[b,ln]=C6[+i],els=[...document.querySelectorAll(`[data-g6="${i}"]`)];g6off();els.forEach(x=>x.classList.add('sel'));const tip=document.getElementById('g6tip'),sec=document.getElementById('l6');document.getElementById('g6txt').innerHTML=`<b>${b[2]} · M${b[0]}–M${b[1]} · ${ln}</b>${b[4]}`;tip.hidden=false;const rs=els.map(x=>x.getBoundingClientRect()),L=Math.min(...rs.map(r=>r.left)),R=Math.max(...rs.map(r=>r.right)),T=Math.min(...rs.map(r=>r.top)),B=Math.max(...rs.map(r=>r.bottom)),s=sec.getBoundingClientRect(),w=tip.offsetWidth,h=tip.offsetHeight;let x=R-s.left+10,y=(T+B)/2-s.top-h/2;if(x+w>s.width-12){x=L-s.left-w-10;if(x<12){x=Math.min(Math.max(12,L-s.left),s.width-w-12);y=B-s.top+8;}}y=Math.max(12,Math.min(y,s.height-h-12));tip.style.left=x+'px';tip.style.top=y+'px';};
document.addEventListener('click',e=>{const t=e.target.closest('[data-g6]');if(t){g6(t);return;}if(e.target.closest('.g6tip .x')||!e.target.closest('.g6tip'))g6off();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')g6off();});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('[data-g6]'))g6(e.target);});
